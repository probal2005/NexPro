[project]
name = "nexpro"
dynamic = ["version"]
description = "The Next Generation Programming Language"
authors = [
    {name = "Probal Dhali"}
]
requires-python = ">=3.11"

[project.scripts]
nexpro = "nexpro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "nexpro.__version__.VERSION"}

[tool.setuptools]
packages = ["nexpro"]
