[project]
name = "nexpro"
dynamic = ["version"]
description = "The NexPro language interpreter and Python compiler"
readme = "README.md"
authors = [
    {name = "Probal Dhali"}
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/probal2005/NexPro"
Playground = "https://nexpro-playground.vercel.app/"

[project.scripts]
nexpro = "nexpro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "nexpro.__version__.VERSION"}

[tool.setuptools]
packages = ["nexpro"]
