name: Build release wheel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the release package
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install pytest dist/nexpro-*.whl
          python -m pytest -q
      - uses: actions/setup-node@v6
        if: hashFiles('editors/vscode/package.json') != ''
        with:
          node-version: "24"
      - name: Package the VS Code extension
        if: hashFiles('editors/vscode/package.json') != ''
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.1.1 package --skip-license --out ../../dist/
      - name: Attach verified packages to their draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python -c 'from importlib.metadata import version; print(version("nexpro"))')"
          target="$(gh release view "$tag" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')"
          test "$target" = "$GITHUB_SHA"
          assets=(dist/nexpro-*.whl)
          if test -d editors/vscode; then
            assets+=("dist/nexpro-${tag#v}.vsix")
          fi
          gh release upload "$tag" "${assets[@]}"
